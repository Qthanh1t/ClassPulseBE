services:
  postgres:
    image: postgres:16-alpine
    container_name: classpulse-postgres
    environment:
      POSTGRES_DB: classpulse
      POSTGRES_USER: classpulse
      POSTGRES_PASSWORD: classpulse_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classpulse -d classpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: classpulse-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: classpulse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    container_name: classpulse-coturn
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped

  # ⚠️ Trên Windows, Docker Desktop (WSL2) NAT chặn media WebRTC khi test 2 thiết bị
  # (chỉ advertise IP nội bộ WSL). DÙNG bản native `livekit-server.exe` thay thế:
  #   .\start-livekit.ps1            (đọc LIVEKIT_NODE_IP từ .env)
  # Service Docker này để opt-in (chỉ chạy 1 máy/Linux), KHÔNG start mặc định để khỏi
  # đụng cổng với bản native. Bật khi cần: `docker compose --profile docker-livekit up -d livekit`
  livekit:
    image: livekit/livekit-server:latest
    container_name: classpulse-livekit
    profiles: ["docker-livekit"]
    command: --config /etc/livekit.yaml --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "7880:7880"          # signaling (WS)
      - "7881:7881"          # ICE/TCP
      - "7882:7882/udp"      # media UDP mux
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
